<style>
  .scrolling-logo-container {
    background-color: #0F2B36;
    padding: 1.5rem 0;
    border-top: 3px solid #2DB6A0;
    border-bottom: 3px solid #2DB6A0;
    margin-top: 2rem;
    overflow: hidden;
  }

  .logo-title {
    color: #62F2C5;
    font-size: 1.1rem;
    font-weight: bold;
    text-align: center;
    margin-bottom: 1rem;
    font-family: 'Roboto', sans-serif;
  }

  .scrolling-track {
    overflow: hidden;
    position: relative;
    height: 60px;
  }

  .scrolling-content {
    display: flex;
    gap: 100px;
    animation: scroll-left 35s linear infinite;
    align-items: center;
  }

  .scrolling-content img {
    height: 40px;
    opacity: 0.95;
    transition: transform 0.3s ease-in-out;
  }

  .scrolling-content img:hover {
    transform: scale(1.2);
  }

  @keyframes scroll-left {
    0% {
      transform: translateX(100%);
    }
    100% {
      transform: translateX(-100%);
    }
  }

  @media (max-width: 600px) {
    .scrolling-content img {
      height: 30px;
    }
  }

  .toolbox-bar {
    position: fixed;
    top: 10%;
    right: 0;
    width: 60px;
    height: 40px;
    background-color: #10333F;
    border-left: 3px solid #2DB6A0;
    border-radius: 12px 0 0 12px;
    padding: 10px 5px;
    box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
    z-index: 9999;
    overflow: hidden;
}

.toolbox-bar .scroll-content {
    display: flex;
    flex-direction: column;
    align-items: center;
    animation: scrollVertical 12s linear infinite;
}

.toolbox-bar .scroll-content img {
    height: 10px;
    margin: 10px 0;
    opacity: 0.95;
    transition: transform 0.3s ease-in-out, filter 0.3s ease;
}

.toolbox-bar .scroll-content img:hover {
    transform: scale(1.2);
    filter: drop-shadow(0 0 6px #62F2C5);
}

@keyframes scrollVertical {
    0% {
        transform: translateY(0);
    }
    100% {
        transform: translateY(-50%);
    }
}

</style>

<div class="scrolling-track">
  <div class="scrolling-content">
    <img src="{{ pathto('_static/ulb.png', 1) }}" alt="ULB">
    <img src="{{ pathto('_static/uds.png', 1) }}" alt="Dschang">
    <img src="{{ pathto('_static/issea.png', 1) }}" alt="ISSEA">
  </div>
</div>

<div class="toolbox-bar">
  <div class="scroll-content">
    <img src="{{ pathto('_static/python.png', 1) }}" alt="Python">
    <img src="{{ pathto('_static/r.png', 1) }}" alt="R">
    <img src="{{ pathto('_static/sas.png', 1) }}" alt="SAS">
    <img src="{{ pathto('_static/latex.png', 1) }}" alt="LaTeX">
    <img src="{{ pathto('_static/tableau.png', 1) }}" alt="Git">
    <img src="{{ pathto('_static/excel.png', 1) }}" alt="Excel">
    <img src="{{ pathto('_static/sql.png', 1) }}" alt="SQL">
    <img src="{{ pathto('_static/python.png', 1) }}" alt="Python">
    <img src="{{ pathto('_static/r.png', 1) }}" alt="R">
    <img src="{{ pathto('_static/sas.png', 1) }}" alt="SAS">
  </div>
</div>
